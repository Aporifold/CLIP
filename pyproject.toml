[project]
name = "CLIP"
version = "v0.1.0"
description = "Unofficial Implementation for ICML'21 Paper: Learning Transferable Visual Models From Natural Language Supervision"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ziyang Fan", email = "bugkiller.fzy@gmail.com" }]
dependencies = [
    "loguru>=0.7.3",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "huggingface-hub>=0.36.2",
    "transformers>=4.57.3,<5.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["pytest>=9.1.1"]

[project.urls]
"Homepage" = "https://clip.github.io"
"Repository" = "https://github.com/Aporifold/CLIP"
"Bug Tracker" = "https://github.com/Aporifold/CLIP/issues"
